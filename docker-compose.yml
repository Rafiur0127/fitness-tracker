services:
  app:
    build: .
    container_name: fitness_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=fitness_tracker1
      - DB_USER=fitness_user
      - DB_PASS=fitness_secret

  db:
    image: mysql:8.0
    container_name: fitness_db
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: fitness_tracker1
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fitness_phpmyadmin
    ports:
      - "8081:80"
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: fitness_user
      PMA_PASSWORD: fitness_secret

volumes:
  db_data: