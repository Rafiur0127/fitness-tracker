name: Local CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build application image
        run: docker build --tag fitness-tracker:test .

      - name: Lint PHP source
        run: |
          docker run --rm fitness-tracker:test sh -c \
            "find app config public -type f -name '*.php' -print0 | xargs -0 -n1 php -l"

      - name: Start the application stack
        run: docker compose up -d --wait

      - name: Smoke test the login page
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1:8080/login.php

      - name: Stop the application stack
        if: always()
        run: docker compose down --volumes
