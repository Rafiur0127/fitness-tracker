<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff8e1; padding: 40px; }
    .container { max-width: 850px; margin: auto; background: #fff; padding: 30px; border-radius: 10px; }
    input, button { padding: 9px; margin: 5px 0; box-sizing: border-box; }
    input { width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    #message { padding: 10px; margin-bottom: 12px; }
  </style>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <h2>Nutrition Tracker</h2>
  <div id="message"></div>
  <form id="nutritionForm">
    <input id="mealName" type="text" placeholder="Meal name" maxlength="100" required>
    <div class="grid">
      <input id="calories" type="number" min="0" placeholder="Calories" required>
      <input id="protein" type="number" min="0" step="0.1" placeholder="Protein (g)">
      <input id="carbs" type="number" min="0" step="0.1" placeholder="Carbs (g)">
      <input id="fat" type="number" min="0" step="0.1" placeholder="Fat (g)">
    </div>
    <button type="submit">Add Meal</button>
  </form>
  <table>
    <thead><tr><th>Meal</th><th>Calories</th><th>Protein</th><th>Carbs</th><th>Fat</th><th>Time</th></tr></thead>
    <tbody id="logs"></tbody>
  </table>
</div>
<script src="./js/app.js"></script>
<script>
const nutritionForm = document.getElementById('nutritionForm');
const message = document.getElementById('message');
const getCsrfToken = FitnessApp.getCsrfToken;
function showMessage(text, error = false) {
  message.textContent = text; message.style.background = error ? '#ffe6e6' : '#e8f5e9';
}
function renderLogs(items) {
  const tbody = document.getElementById('logs'); tbody.innerHTML = '';
  if (!items.length) { tbody.innerHTML = '<tr><td colspan="6">No nutrition logs yet.</td></tr>'; return; }
  items.forEach((item) => {
    const row = document.createElement('tr');
    [item.meal_name, item.calories, `${item.protein} g`, `${item.carbs} g`, `${item.fat} g`, item.meal_time]
      .forEach((value) => { const cell = document.createElement('td'); cell.textContent = value; row.appendChild(cell); });
    tbody.appendChild(row);
  });
}
async function loadNutrition() {
  const response = await fetch('./api/nutrition.php', { credentials: 'same-origin' });
  if (response.status === 401) { FitnessApp.redirectToLogin(); return; }
  const result = await response.json();
  if (!response.ok || !result.success) throw new Error(result.message);
  renderLogs(result.data.logs);
}
nutritionForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  try {
    const response = await fetch('./api/nutrition.php', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'X-CSRF-Token': await getCsrfToken() },
      body: JSON.stringify({
        meal_name: document.getElementById('mealName').value.trim(),
        calories: Number(document.getElementById('calories').value),
        protein: Number(document.getElementById('protein').value || 0),
        carbs: Number(document.getElementById('carbs').value || 0),
        fat: Number(document.getElementById('fat').value || 0)
      })
    });
    const result = await response.json();
    if (!response.ok || !result.success) throw new Error(result.message);
    showMessage(result.message); nutritionForm.reset(); await loadNutrition();
  } catch (error) { showMessage(error.message || 'Unable to save nutrition log.', true); }
});
loadNutrition().catch((error) => showMessage(error.message || 'Unable to load nutrition logs.', true));
</script>
</body>
</html>
