<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/frontend

    Alias /api/ /var/www/html/public/api/

    <Directory /var/www/html/frontend>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    <Directory /var/www/html/public/api>
        AllowOverride None
        Require all granted
        Options -Indexes
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    DirectoryIndex login.html
</VirtualHost>
